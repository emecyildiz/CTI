name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag and package version
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "$expected_tag"

      - name: Validate configuration and scripts
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.example --profile managed-n8n config --quiet
          for script in setup.sh scripts/*.sh installer/linux/*.sh; do sh -n "$script"; done
          for workflow in workflows/*.json; do jq empty "$workflow"; done
          grep -Fq "__CTI_TELEGRAM_ALLOWED_ID__" workflows/cti-telegram-query.json
          grep -Fq '"chatId": "__CTI_TELEGRAM_CHAT_ID__"' workflows/cti-weekly-telegram-delivery.json
          grep -Fq '"chatId": "__CTI_TELEGRAM_CHAT_ID__"' workflows/n8n-workflow-error-alerts.json
          grep -Fq 'CTI_TELEGRAM_QUERY_ENABLED=false' .env.example
          grep -Fq 'WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}' compose.yml
          grep -Fq -- '--telegram-webhook-url' installer/linux/cti-setup.sh
          dotnet build app/cti-dashboard/CtiDashboard.csproj --configuration Release
          dotnet build installer/windows/CtiInstaller.csproj --configuration Release

      - name: Build checksummed release archive
        shell: bash
        run: sh ./scripts/build-release.sh dist

      - name: Build checksummed Linux installer
        shell: bash
        run: sh ./scripts/build-linux-installer.sh dist

      - name: Build checksummed Windows installer
        shell: bash
        run: sh ./scripts/build-windows-installer.sh dist

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --prerelease \
            --title "CTI Self-Hosted $GITHUB_REF_NAME" \
            --notes-file RELEASE-NOTES.md
