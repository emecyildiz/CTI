name: ${CTI_COMPOSE_PROJECT_NAME:-cti-self-hosted}

services:
  cti-db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cti}
      POSTGRES_USER: ${POSTGRES_USER:-cti_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      CTI_APP_PASSWORD: ${CTI_APP_PASSWORD:?set CTI_APP_PASSWORD in .env}
      CTI_DASHBOARD_PASSWORD: ${CTI_DASHBOARD_PASSWORD:?set CTI_DASHBOARD_PASSWORD in .env}
    volumes:
      - cti_pgdata:/var/lib/postgresql/data
      - ./app/cti/init-database.sh:/docker-entrypoint-initdb.d/010-init-database.sh:ro
      - ./app/cti/schema.sql:/opt/cti/schema.sql:ro
      - ./app/cti/migrations:/opt/cti/migrations:ro
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      # Wait for the final TCP server, not the socket-only init server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      cti:
        aliases:
          - cti-db

  cti-dashboard:
    build:
      context: ./app/cti-dashboard
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      CTI_AUTH_MODE: local
      CTI_APPLICATION_NAME: cti-self-hosted-dashboard
      CTI_DASHBOARD_PASSWORD: ${CTI_DASHBOARD_PASSWORD:?set CTI_DASHBOARD_PASSWORD in .env}
      CTI_N8N_API_URL: ${CTI_N8N_API_URL:-http://cti-n8n:5678/api/v1}
      CTI_TELEGRAM_QUERY_ENABLED: ${CTI_TELEGRAM_QUERY_ENABLED:-false}
      CTI_TELEGRAM_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      CtiDatabase__Host: cti-db
      CtiDatabase__Name: ${POSTGRES_DB:-cti}
      CtiDatabase__Username: cti_dashboard
    depends_on:
      cti-db:
        condition: service_healthy
    ports:
      - "${CTI_DASHBOARD_BIND:-127.0.0.1}:${CTI_DASHBOARD_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    pids_limit: 128
    mem_limit: 192m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cti

  cti-n8n:
    image: docker.n8n.io/n8nio/n8n:2.30.5@sha256:450853cd21a2ce36587c4c860eb26927c1ceba9496bf55f4c213b5d3a6dc8c6f
    container_name: ${N8N_CONTAINER:-cti-n8n}
    profiles:
      - managed-n8n
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: 0.0.0.0
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-0}
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-UTC}
      TZ: ${N8N_TIMEZONE:-UTC}
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - cti_n8n_data:/home/node/.n8n
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.00
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cti

volumes:
  cti_pgdata:
  cti_n8n_data:

networks:
  cti:
    name: ${CTI_NETWORK_NAME:-cti-self-hosted}
